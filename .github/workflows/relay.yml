name: relay
on:
  push:
    branches: [arena/01a0b8d8-type]
    paths:
      - 'relay/req-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0b8d8-type
      - name: relay
        run: |
          set -x
          # find newest req-N.json without matching resp-N.json
          REQ=""
          for f in $(ls -1 relay/req-*.json 2>/dev/null | sort -V | tac); do
            N=$(basename "$f")
            if [ ! -f "relay/${N/req/resp}" ]; then REQ="$f"; break; fi
          done
          if [ -z "$REQ" ]; then echo "no pending request"; exit 0; fi
          echo "processing $REQ"
          python3 - <<'PY'
          import json, glob, os, subprocess, urllib.parse
          req = sorted(glob.glob('relay/req-*.json'), key=lambda p: int(p.split('-')[1].split('.')[0]))
          for f in req:
              n = os.path.basename(f).replace('req-','').replace('.json','')
              out = f'relay/resp-{n}.json'
              if os.path.exists(out): continue
              spec = json.load(open(f))
              url = spec['url']
              method = spec.get('method','GET')
              headers = spec.get('headers',{})
              body = spec.get('body')
              cmd = ['curl','-sS','-i','--max-time','60','-X',method]
              for k,v in headers.items():
                  cmd += ['-H', f'{k}: {v}']
              if body is not None:
                  cmd += ['--data', body]
              cmd += ['--', url]
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=90)
                  resp = {'stdout': r.stdout, 'stderr': r.stderr, 'rc': r.returncode}
              except Exception as e:
                  resp = {'error': str(e)}
              json.dump(resp, open(out,'w'), indent=1)
          PY
          git config user.email "agent@arena.local"
          git config user.name "arena-agent-relay"
          git add relay/
          if ! git diff --cached --quiet; then
            git commit -m "relay: responses"
            git push origin HEAD:arena/01a0b8d8-type
          fi
